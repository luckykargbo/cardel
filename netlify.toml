# SALONEAUTOLINK — NETLIFY CONFIGURATION
[build]
  publish = "."
  functions = "functions"

# Custom Admin Gate URL rewrite
[[redirects]]
  from = "/admin/get/get_chenor*"
  to = "/admin.html"
  status = 200

# Express API serverless function routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
